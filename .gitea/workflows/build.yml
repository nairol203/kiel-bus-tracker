name: Build and Push the Image

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    lint-and-format:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
              with:
                  node-version: '24.22.2'

            - name: Install dependencies
              run: npm ci

            - name: Check Formatting
              run: npx prettier --check .

            - name: Run Linter
              run: npm run lint

    build-and-push:
        needs: lint-and-format
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

            - name: Log in to Gitea container registry
              uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
              with:
                  registry: git.zao.dev
                  username: ${{ gitea.repository_owner }}
                  password: ${{ secrets.CONTAINER_REGISTRY_PASSWORD }}

            - name: Log in to GitHub container registry
              uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
              with:
                  registry: ghcr.io
                  username: ${{ gitea.repository_owner }}
                  password: ${{ secrets.GHCR_PASSWORD }}

            - name: Extract metadata (tags, labels) for Docker
              id: meta
              uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
              with:
                  images: |
                      git.zao.dev/${{ gitea.repository }}
                      ghcr.io/${{ gitea.repository }}

            # - name: Set up QEMU
            #   uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
              with:
                  driver-opts: |
                      network=action-runner

            - name: Build and push the image
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
              with:
                  context: .
                  platforms: linux/amd64
                  push: ${{ gitea.event_name == 'push' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  # cache-from: type=registry,ref=git.zao.dev/${{ gitea.repository }}:buildcache
                  # cache-to: type=registry,ref=git.zao.dev/${{ gitea.repository }}:buildcache,mode=max
